openapi: 3.1.0
info:
  title: PowerPay API
  version: 1.0.0-beta.1
  summary: Professional multichain merchant payment API
  description: |
    PowerPay API provides payment creation, hosted checkout sessions, clients,
    QR checkout, POS charges, integrations, trusted tokens, cross-border
    settlement, API discovery, and WebSocket event delivery.
  license:
    name: Apache-2.0
servers:
  - url: http://localhost:5173
    description: Local development
  - url: https://api.powerpay.example
    description: Production placeholder
tags:
  - name: System
  - name: Payments
  - name: Sessions
  - name: Clients
  - name: Checkout
  - name: Integrations
  - name: Settlement
paths:
  /api/v1:
    get:
      operationId: getApiIndex
      tags: [System]
      summary: Discover the PowerPay API
      responses:
        "200":
          description: API discovery document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiIndex"
  /api/v1/openapi:
    get:
      operationId: getOpenApiInfo
      tags: [System]
      summary: Locate the OpenAPI specification and UI
      responses:
        "200":
          description: OpenAPI locations
  /api/v1/websocket:
    get:
      operationId: getWebSocketInfo
      tags: [System]
      summary: Read WebSocket connection information
      responses:
        "200":
          description: WebSocket configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebSocketInfo"
  /api/v1/health:
    get:
      operationId: getHealth
      tags: [System]
      summary: Check API and network health
      responses:
        "200":
          description: Service health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /api/v1/cors:
    get:
      operationId: getCorsPolicy
      tags: [System]
      summary: Read the public CORS policy
      responses:
        "200":
          description: CORS policy
    options:
      operationId: preflightCors
      tags: [System]
      responses:
        "204":
          description: Preflight accepted
  /api/v1/payments:
    get:
      operationId: listPayments
      tags: [Payments]
      responses:
        "200":
          description: Payment page
    post:
      operationId: createPayment
      tags: [Payments]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePaymentRequest"
      responses:
        "201":
          description: Payment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/payments/{paymentId}:
    get:
      operationId: getPayment
      tags: [Payments]
      parameters:
        - $ref: "#/components/parameters/PaymentId"
      responses:
        "200":
          description: Payment
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/sessions:
    post:
      operationId: createSession
      tags: [Sessions]
      responses:
        "201":
          description: Session created
  /api/v1/sessions/{sessionId}:
    get:
      operationId: getSession
      tags: [Sessions]
      parameters:
        - in: path
          name: sessionId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Checkout session
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/clients:
    get:
      operationId: listClients
      tags: [Clients]
      responses:
        "200":
          description: Client page
    post:
      operationId: createClient
      tags: [Clients]
      responses:
        "201":
          description: Client created
  /api/v1/clients/{clientId}:
    get:
      operationId: getClient
      tags: [Clients]
      parameters:
        - in: path
          name: clientId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Client
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/qr-payments:
    post:
      operationId: createQrPayment
      tags: [Checkout]
      responses:
        "201":
          description: QR payment created
  /api/v1/pos/charges:
    post:
      operationId: createPosCharge
      tags: [Checkout]
      responses:
        "201":
          description: POS charge created
  /api/v1/pos/terminals:
    get:
      operationId: listPosTerminals
      tags: [Checkout]
      responses:
        "200":
          description: Terminal page
  /api/v1/integrations:
    get:
      operationId: listIntegrations
      tags: [Integrations]
      responses:
        "200":
          description: Integration page
  /api/v1/integrations/{integrationId}:
    get:
      operationId: getIntegration
      tags: [Integrations]
      parameters:
        - in: path
          name: integrationId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Integration
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/trusted-tokens:
    get:
      operationId: listTrustedTokens
      tags: [Settlement]
      responses:
        "200":
          description: Trusted token registry
  /api/v1/cross-border:
    post:
      operationId: createCrossBorderTransfer
      tags: [Settlement]
      responses:
        "201":
          description: Cross-border transfer created
        "400":
          $ref: "#/components/responses/BadRequest"
components:
  parameters:
    PaymentId:
      in: path
      name: paymentId
      required: true
      schema: { type: string }
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    InternalError:
      description: Internal or upstream failure
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
  schemas:
    ApiIndex:
      type: object
      required: [name, version, status, routes]
      properties:
        name: { type: string }
        version: { type: string }
        status: { type: string }
        documentation: { type: string }
        websocket: { type: string }
        routes: { type: object, additionalProperties: true }
    HealthResponse:
      type: object
      required: [status, version, timestamp, cluster]
      properties:
        status: { type: string, enum: [ok, degraded] }
        version: { type: string, example: 1.0.0-beta.1 }
        timestamp: { type: string, format: date-time }
        cluster: { type: string }
    CreatePaymentRequest:
      type: object
      required: [merchant, amount, currency, orderId]
      properties:
        merchant: { type: string }
        amount: { type: string, pattern: '^\d+(?:\.\d+)?$' }
        currency: { type: string }
        mint: { type: string }
        orderId: { type: string, maxLength: 128 }
        label: { type: string, maxLength: 64 }
        message: { type: string, maxLength: 256 }
        memo: { type: string, maxLength: 566 }
        expiresInSeconds:
          type: integer
          minimum: 60
          maximum: 86400
    Payment:
      type: object
      required: [id, orderId, amount, currency, status, createdAt, expiresAt]
      properties:
        id: { type: string }
        orderId: { type: string }
        merchant: { type: string }
        amount: { type: string }
        currency: { type: string }
        status: { type: string }
        paymentUrl: { type: string, format: uri }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
    WebSocketInfo:
      type: object
      required: [endpoint, protocol, heartbeatSeconds, reconnect, events]
      properties:
        endpoint: { type: string, format: uri }
        protocol: { type: string, const: powerpay.v1 }
        heartbeatSeconds: { type: integer }
        reconnect:
          type: object
          required: [initialDelayMs, maximumDelayMs, multiplier]
          properties:
            initialDelayMs: { type: integer }
            maximumDelayMs: { type: integer }
            multiplier: { type: number }
        events:
          type: array
          items: { type: string }
    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code: { type: string }
            message: { type: string }
            details: {}
            requestId: { type: string }
            retryable: { type: boolean }
